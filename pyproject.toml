[project]
name = "carbonplan-styles"
version = "0.6.0"
description = "CarbonPlan plotting styles for matplotlib and xarray"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "CarbonPlan", email = "tech@carbonplan.org" }]
requires-python = ">=3.12"
dependencies = ["matplotlib>=3.8"]

[project.optional-dependencies]
xarray = ["xarray"]

[project.urls]
repository = "https://github.com/carbonplan/styles"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "prek>=0.5.10",
    "pytest>=9.0.2",
    "ty>=0.0.59",
    "xarray",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
extend-select = ["I", "UP"]
